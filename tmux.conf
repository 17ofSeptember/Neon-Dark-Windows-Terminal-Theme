# Neon Dark tmux configuration
# Intended for WSL/Linux shells running inside Windows Terminal.

# Keep tmux usable with modern terminals.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse support for selecting panes and resizing borders.
set -g mouse on

# Faster escape handling.
set -sg escape-time 10

# Keep more scrollback.
set -g history-limit 50000

# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Persistent pane title across the top border.
set -g pane-border-status top
set -g pane-border-format " #[bold] #{pane_title} #[default] "

# Match the Neon Dark palette.
set -g pane-border-style "fg=#6B7089"
set -g pane-active-border-style "fg=#DA8FFF"

# Status bar.
set -g status on
set -g status-position bottom
set -g status-style "bg=#32D74B,fg=#090A0F"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bold] [#S] "
set -g status-right "\"#{pane_title}\" %H:%M %d-%b-%y "

# Window list.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold] #I:#W* "

# Message and mode styling.
set -g message-style "bg=#BF5AF2,fg=#090A0F"
setw -g mode-style "bg=#FFD60A,fg=#090A0F"

# Reload config with Prefix + r.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Set a pane title manually:
# tmux select-pane -T "MAIN"
